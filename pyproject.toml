[project]
name = "ali"
version = "0.1.0"
description = "Ali: compañera virtual con memoria, personalidad propia y habilidades extensibles (Claude API)"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.8.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
